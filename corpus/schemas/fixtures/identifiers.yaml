# yaml-language-server: $schema=https://json-schema.org/draft/2020-12/schema
# Identifier format cases: offline validity of annotation values.
---
$id: https://github.com/asciichem/asciichem-tests/v1/fixtures/identifiers
title: AsciiChem identifier fixture
type: object
required: [id, convention, value, valid]
additionalProperties: false
properties:
  id:
    type: string
    pattern: "^[a-z0-9][a-z0-9/-]*$"
  since:
    type: string
  convention:
    enum: [cas, inchi, inchikey, smiles]
  value:
    type: string
  valid:
    type: boolean
