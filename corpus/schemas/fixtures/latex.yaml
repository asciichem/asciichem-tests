# yaml-language-server: $schema=https://json-schema.org/draft/2020-12/schema
# LaTeX golden cases: byte-exact output of the reference implementation.
---
$id: https://github.com/asciichem/asciichem-tests/v1/fixtures/latex
title: AsciiChem LaTeX golden fixture
type: object
required: [id, input, parses, latex]
additionalProperties: false
properties:
  id:
    type: string
    pattern: "^[a-z0-9][a-z0-9/-]*$"
  tags:
    type: array
    items: { type: string }
  since:
    type: string
  input:
    type: string
  parses:
    type: boolean
  roundTrip:
    type: boolean
  referenceRender:
    type: boolean
    description: >
      The golden embeds the reference implementation's math-engine
      output (Plurimath). Implementations without an embedded math
      engine skip the row; the skip is the documented degradation,
      not a silent drop. The reference itself still gates on it.
  latex:
    type: string
    description: byte-exact golden; implementations compare as strings.
