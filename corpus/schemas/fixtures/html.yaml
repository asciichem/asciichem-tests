# yaml-language-server: $schema=https://json-schema.org/draft/2020-12/schema
# HTML golden cases: byte-exact output of the reference implementation.
---
$id: https://github.com/asciichem/asciichem-tests/v1/fixtures/html
title: AsciiChem HTML golden fixture
type: object
required: [id, input, parses, html]
additionalProperties: false
properties:
  id:
    type: string
    pattern: "^[a-z0-9][a-z0-9/-]*$"
  tags:
    type: array
    items: { type: string }
  since:
    type: string
  input:
    type: string
  parses:
    type: boolean
  roundTrip:
    type: boolean
  html:
    type: string
    description: byte-exact golden; implementations compare as strings.
